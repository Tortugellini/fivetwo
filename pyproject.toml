[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fivetwo"
version = "1.0"
description = "Card shuffle and analysis program."
authors = [
  { email = "project.testing010@gmail.com" }
]
dependencies = [
  "numpy==2.4.6",
  "matplotlib==3.11.0",
  "ipykernel==7.3.0",
  "networkx==3.6.1",
  "scipy==1.18.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
