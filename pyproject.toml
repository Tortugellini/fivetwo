[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fivetwo"
version = "0.1"
description = "Card shuffle and analysis program."
authors = [
  { email = "project.testing010@gmail.com" }
]
dependencies = [
  "numpy",
  "ipykernel",
  "pandas",
  "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
